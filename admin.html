<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#07131b'><title>Sabor Mar Admin</title><link rel='manifest' href='manifest-admin.json'><link rel='stylesheet' href='styles.css'><script src='https://cdn.jsdelivr.net/npm/appwrite@17.0.0'></script></head><body><div class='shell'><h1>⚓ Sabor Mar Admin</h1><section id='auth' class='card'><h2>Acceso administrador</h2><label>Email</label><input id='email' type='email'><label>Contraseña</label><input id='pass' type='password'><button id='login'>Entrar</button><div id='msg' class='muted'></div></section><section id='dash' class='hidden'><div class='grid'><div class='metric'><div class='muted'>Clientes</div><div id='clients' class='v'>0</div></div><div class='metric'><div class='muted'>Marketing</div><div id='marketingCount' class='v'>0</div></div><div class='metric'><div class='muted'>Pendientes</div><div id='pending' class='v'>0</div></div><div class='metric'><div class='muted'>Participaciones</div><div id='entries' class='v'>0</div></div></div><div class='card'><button id='logout' class='secondary'>Salir</button></div><div class='card'><h2>Tickets</h2><div id='ticketList'></div></div><div class='card'><h2>Clientes</h2><div id='customerList'></div></div><div class='card'><h2>Promoción</h2><div class='row'><div><label>Nombre</label><input id='campName'></div><div><label>€ por participación</label><input id='euros' type='number'></div></div><div class='row'><div><label>Multiplicador domicilio</label><input id='mult' type='number'></div><div><button id='saveCamp'>Guardar</button></div></div><br><button id='newCamp' class='danger'>Nueva promoción / poner contadores a cero</button></div></section></div><script src='config.js'></script><script>const C=APP_CONFIG,client=new Appwrite.Client().setEndpoint(C.endpoint).setProject(C.projectId),account=new Appwrite.Account(client),db=new Appwrite.TablesDB(client),storage=new Appwrite.Storage(client),ID=Appwrite.ID,$=x=>document.getElementById(x),eur=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});let user=null;async function me(){try{return await account.get()}catch{return null}}async function rows(t,q=[]){let r=await db.listRows({databaseId:C.databaseId,tableId:t,queries:q,total:false});return r.rows||[]}async function isAdmin(){user=await me();return !!user&&Array.isArray(user.labels)&&user.labels.includes('admin')}async function render(){if(!(await isAdmin())){$('dash').classList.add('hidden');$('auth').classList.remove('hidden');if(user)$('msg').textContent='Tu usuario no tiene la etiqueta admin.';return}$('auth').classList.add('hidden');$('dash').classList.remove('hidden');let [cs,ts,camps]=await Promise.all([rows(C.customersTable),rows(C.ticketsTable),rows(C.campaignsTable)]),c=camps.find(x=>x.active)||null,ct=c?ts.filter(t=>t.campaign_id===c.$id):[];$('clients').textContent=cs.length;$('marketingCount').textContent=cs.filter(x=>x.marketing_consent).length;$('pending').textContent=ts.filter(x=>x.status==='pendiente').length;$('entries').textContent=ct.filter(x=>x.status==='validado').reduce((a,t)=>a+Number(t.entries||0),0);$('customerList').innerHTML=cs.length?`<table><tr><th>Nombre</th><th>Email</th><th>Marketing</th></tr>${cs.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.marketing_consent?'Sí':'No'}</td></tr>`).join('')}</table>`:'<div class="muted">Sin clientes.</div>';$('ticketList').innerHTML=ts.length?ts.map(t=>`<div class='item'><b>${t.customer_email}</b><div class='muted'>${eur(t.amount)} · ${t.ticket_number||'sin número'} · ${t.status}</div>${t.photo_file_id?`<img class='photo' src='${storage.getFileView({bucketId:C.ticketsBucket,fileId:t.photo_file_id})}'>`:''}${t.status==='pendiente'?`<p><button data-id='${t.$id}' data-ok='1'>Validar</button> <button data-id='${t.$id}' data-ok='0' class='danger'>Rechazar</button></p>`:''}</div>`).join(''):'<div class="muted">Sin tickets.</div>';$('campName').value=c?.name||'';$('euros').value=c?.euros_per_entry||30;$('mult').value=c?.delivery_multiplier||2}login.onclick=async()=>{try{await account.createEmailPasswordSession({email:$('email').value.trim().toLowerCase(),password:$('pass').value});render()}catch(e){$('msg').textContent=e.message}};logout.onclick=async()=>{await account.deleteSession({sessionId:'current'});render()};ticketList.onclick=async e=>{let b=e.target.closest('button[data-id]');if(!b)return;let t=await db.getRow({databaseId:C.databaseId,tableId:C.ticketsTable,rowId:b.dataset.id}),c=(await rows(C.campaignsTable)).find(x=>x.$id===t.campaign_id),ok=b.dataset.ok==='1',entries=Math.floor(Number(t.amount||0)/Number(c?.euros_per_entry||30))*(t.channel==='domicilio'?Number(c?.delivery_multiplier||2):1);await db.updateRow({databaseId:C.databaseId,tableId:C.ticketsTable,rowId:t.$id,data:{status:ok?'validado':'rechazado',entries:ok?entries:0,validated_at:new Date().toISOString()}});render()};saveCamp.onclick=async()=>{let camps=await rows(C.campaignsTable),c=camps.find(x=>x.active);if(c)await db.updateRow({databaseId:C.databaseId,tableId:C.campaignsTable,rowId:c.$id,data:{name:$('campName').value.trim()||c.name,euros_per_entry:Number($('euros').value||30),delivery_multiplier:Number($('mult').value||2)}});render()};newCamp.onclick=async()=>{if(!confirm('¿Crear nueva promoción y poner contadores visibles a cero? El histórico se conserva.'))return;let camps=await rows(C.campaignsTable);for(const c of camps.filter(x=>x.active))await db.updateRow({databaseId:C.databaseId,tableId:C.campaignsTable,rowId:c.$id,data:{active:false}});let name=prompt('Nombre de la nueva promoción:','Nueva promoción')||'Nueva promoción';await db.createRow({databaseId:C.databaseId,tableId:C.campaignsTable,rowId:ID.unique(),data:{name,active:true,euros_per_entry:30,delivery_multiplier:2,created_at:new Date().toISOString()}});render()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();</script></body></html>
