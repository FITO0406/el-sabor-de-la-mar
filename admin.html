<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07131b">
<title>Sabor Mar Admin</title><link rel="manifest" href="manifest-admin.json"><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/appwrite@26.2.0"></script>
</head>
<body><div class="shell"><h1>⚓ Sabor Mar Admin</h1>
<section id="auth" class="card"><h2>Acceso administrador</h2><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit">Entrar</button></form><div id="msg" class="status" role="status" aria-live="polite"></div></section>
<section id="dash" class="hidden"><div class="grid"><div class="metric"><div class="muted">Clientes</div><div id="clients" class="v">0</div></div><div class="metric"><div class="muted">Marketing</div><div id="marketingCount" class="v">0</div></div><div class="metric"><div class="muted">Pendientes</div><div id="pending" class="v">0</div></div><div class="metric"><div class="muted">Participaciones</div><div id="entries" class="v">0</div></div></div><div class="card"><div class="top"><div><b id="adminWho"></b><div id="adminLabels" class="muted"></div></div><button id="logout" type="button" class="secondary">Salir</button></div></div><div class="card"><h2>Tickets</h2><div id="ticketList"></div><div id="ticketMsg" class="status"></div></div><div class="card"><h2>Clientes</h2><div id="customerList"></div></div><div class="card"><h2>Promoción</h2><div class="row"><div><label>Nombre</label><input id="campName"></div><div><label>€ por participación</label><input id="euros" type="number" min="0.01" step="0.01"></div></div><div class="row"><div><label>Multiplicador domicilio</label><input id="mult" type="number" min="1" step="1"></div><div class="action-end"><button id="saveCamp" type="button">Guardar</button></div></div><div id="campMsg" class="status"></div><br><button id="newCamp" type="button" class="danger">Nueva promoción / poner contadores a cero</button></div></section>
</div><script src="config.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),C=window.APP_CONFIG;function setMsg(id,text,ok=false){const e=$(id);if(!e)return;e.textContent=text||'';e.className='status '+(ok?'ok':'err')}function busy(b,on,t){b.disabled=on;if(on){b.dataset.old=b.textContent;b.textContent=t}else if(b.dataset.old)b.textContent=b.dataset.old}if(!window.Appwrite){setMsg('msg','No se ha podido cargar Appwrite. Recarga la página.');return}if(!C){setMsg('msg','Falta config.js.');return}
const client=new Appwrite.Client().setEndpoint(C.endpoint).setProject(C.projectId),account=new Appwrite.Account(client),db=new Appwrite.TablesDB(client),storage=new Appwrite.Storage(client),ID=Appwrite.ID;let user=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),eur=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});
async function getMe(){try{return await account.get()}catch{return null}}async function rows(t){const r=await db.listRows({databaseId:C.databaseId,tableId:t,total:false,ttl:0});return r.rows||[]}function isAdminUser(u){return !!u&&Array.isArray(u.labels)&&u.labels.map(x=>String(x).toLowerCase()).includes('admin')}
async function render(){try{user=await getMe();if(!isAdminUser(user)){$('dash').classList.add('hidden');$('auth').classList.remove('hidden');if(user)setMsg('msg','Sesión iniciada como '+user.email+', pero no tiene la etiqueta admin. Etiquetas: '+(user.labels?.join(', ')||'ninguna'));return false}$('auth').classList.add('hidden');$('dash').classList.remove('hidden');setMsg('msg','');$('adminWho').textContent=user.email;$('adminLabels').textContent='Etiquetas: '+(user.labels?.join(', ')||'ninguna');const [cs,ts,camps]=await Promise.all([rows(C.customersTable),rows(C.ticketsTable),rows(C.campaignsTable)]),c=camps.find(x=>x.active)||null,current=c?ts.filter(t=>t.campaign_id===c.$id):[];$('clients').textContent=cs.length;$('marketingCount').textContent=cs.filter(x=>x.marketing_consent).length;$('pending').textContent=ts.filter(x=>x.status==='pendiente').length;$('entries').textContent=current.filter(x=>x.status==='validado').reduce((a,t)=>a+Number(t.entries||0),0);$('customerList').innerHTML=cs.length?`<div class="table-wrap"><table><tr><th>Nombre</th><th>Email</th><th>Marketing</th></tr>${cs.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${x.marketing_consent?'Sí':'No'}</td></tr>`).join('')}</table></div>`:'<div class="muted">Sin clientes.</div>';$('ticketList').innerHTML=ts.length?ts.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).map(t=>{let p='';if(t.photo_file_id){try{p=`<img class="photo" alt="Ticket" src="${esc(String(storage.getFileView({bucketId:C.ticketsBucket,fileId:t.photo_file_id})))}">`}catch{}}return `<div class="item"><div class="top"><b>${esc(t.customer_email)}</b><span class="badge ${esc(t.status)}">${esc(t.status)}</span></div><div class="muted">${eur(t.amount)} · ${esc(t.ticket_number||'sin número')} · ${esc(t.channel)}</div>${p}${t.status==='pendiente'?`<p><button type="button" data-id="${esc(t.$id)}" data-ok="1">Validar</button> <button type="button" data-id="${esc(t.$id)}" data-ok="0" class="danger">Rechazar</button></p>`:''}</div>`}).join(''):'<div class="muted">Sin tickets.</div>';$('campName').value=c?.name||'';$('euros').value=c?.euros_per_entry||30;$('mult').value=c?.delivery_multiplier||2;return true}catch(e){setMsg('msg','Login correcto, pero el panel no puede cargar: '+(e.message||e));return false}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('loginBtn'),email=$('email').value.trim().toLowerCase(),password=$('pass').value;if(!email||!password){setMsg('msg','Escribe email y contraseña.');return}busy(b,true,'Entrando…');setMsg('msg','');try{const current=await getMe();if(current&&!isAdminUser(current)){try{await account.deleteSession({sessionId:'current'})}catch{}}else if(current&&isAdminUser(current)&&current.email.toLowerCase()===email){await render();return}else if(current){try{await account.deleteSession({sessionId:'current'})}catch{}}await account.createEmailPasswordSession({email,password});const logged=await account.get();if(!isAdminUser(logged)){setMsg('msg','Credenciales válidas, pero '+logged.email+' no tiene la etiqueta admin. Ve a Appwrite > Auth > Users y añade la etiqueta admin.');return}await render()}catch(err){const code=err?.code?' (código '+err.code+')':'';setMsg('msg','No se pudo entrar'+code+': '+(err?.message||err))}finally{busy(b,false)}});
$('logout').addEventListener('click',async()=>{try{await account.deleteSession({sessionId:'current'})}catch{}user=null;await render()});
$('ticketList').addEventListener('click',async e=>{const b=e.target.closest('button[data-id]');if(!b)return;busy(b,true,b.dataset.ok==='1'?'Validando…':'Rechazando…');try{const t=await db.getRow({databaseId:C.databaseId,tableId:C.ticketsTable,rowId:b.dataset.id}),c=(await rows(C.campaignsTable)).find(x=>x.$id===t.campaign_id),ok=b.dataset.ok==='1',n=Math.floor(Number(t.amount||0)/Number(c?.euros_per_entry||30))*(t.channel==='domicilio'?Number(c?.delivery_multiplier||2):1);await db.updateRow({databaseId:C.databaseId,tableId:C.ticketsTable,rowId:t.$id,data:{status:ok?'validado':'rechazado',entries:ok?n:0,validated_at:new Date().toISOString()}});setMsg('ticketMsg',ok?'Ticket validado.':'Ticket rechazado.',true);await render()}catch(err){setMsg('ticketMsg',err?.message||String(err));busy(b,false)}});
$('saveCamp').addEventListener('click',async()=>{const b=$('saveCamp');busy(b,true,'Guardando…');try{const camps=await rows(C.campaignsTable),c=camps.find(x=>x.active);if(!c)throw Error('No hay campaña activa.');await db.updateRow({databaseId:C.databaseId,tableId:C.campaignsTable,rowId:c.$id,data:{name:$('campName').value.trim()||c.name,euros_per_entry:Number($('euros').value||30),delivery_multiplier:Number($('mult').value||2)}});setMsg('campMsg','Promoción actualizada.',true);await render()}catch(err){setMsg('campMsg',err?.message||String(err))}finally{busy(b,false)}});
$('newCamp').addEventListener('click',async()=>{if(!confirm('¿Crear una nueva promoción? El histórico se conserva.'))return;const b=$('newCamp');busy(b,true,'Creando…');try{const camps=await rows(C.campaignsTable);for(const c of camps.filter(x=>x.active))await db.updateRow({databaseId:C.databaseId,tableId:C.campaignsTable,rowId:c.$id,data:{active:false}});const name=(prompt('Nombre:','Nueva promoción')||'Nueva promoción').trim();await db.createRow({databaseId:C.databaseId,tableId:C.campaignsTable,rowId:ID.unique(),data:{name,active:true,euros_per_entry:30,delivery_multiplier:2,created_at:new Date().toISOString()}});setMsg('campMsg','Nueva promoción creada.',true);await render()}catch(err){setMsg('campMsg',err?.message||String(err))}finally{busy(b,false)}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();})();
</script></body></html>
