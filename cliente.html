<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#07131b'><title>El Sabor de la Mar</title><link rel='manifest' href='manifest-client.json'><link rel='stylesheet' href='styles.css'><script src='https://cdn.jsdelivr.net/npm/appwrite@17.0.0'></script></head><body><div class='shell'><h1>🌊 El Sabor de la Mar</h1><section id='auth' class='card'><h2>Entrar</h2><label>Email</label><input id='email' type='email'><label>Contraseña</label><input id='pass' type='password'><button id='login'>Entrar</button><hr><h3>Crear cuenta</h3><label>Nombre</label><input id='name'><label><input id='marketing' type='checkbox' style='width:auto'> Quiero recibir promociones por email</label><br><br><button id='signup' class='secondary'>Crear cuenta</button><div id='msg' class='muted'></div></section><section id='dash' class='hidden'><div class='card'><div class='top'><div><div class='muted'>Hola</div><h2 id='hello'></h2></div><button id='logout' class='secondary'>Salir</button></div></div><div class='grid'><div class='metric'><div class='muted'>Participaciones</div><div id='entries' class='v'>0</div></div><div class='metric'><div class='muted'>Tickets</div><div id='ticketsCount' class='v'>0</div></div><div class='metric'><div class='muted'>Compra acumulada</div><div id='spend' class='v'>0 €</div></div><div class='metric'><div class='muted'>Promoción</div><div id='camp' class='v'>—</div></div></div><div class='card'><h2>📸 Fotografiar ticket</h2><div class='row'><div><label>Foto</label><input id='photo' type='file' accept='image/*' capture='environment'></div><div><label>Canal</label><select id='channel'><option value='tienda'>Tienda</option><option value='domicilio'>Domicilio</option></select></div></div><div class='row'><div><label>Importe (€)</label><input id='amount' type='number' step='0.01'></div><div><label>Nº ticket</label><input id='ticketNo'></div></div><button id='send'>Enviar ticket</button><div id='sendMsg' class='muted'></div></div><div class='card'><h2>Mis tickets</h2><div id='list'></div></div></section></div><script src='config.js'></script><script>const C=APP_CONFIG,client=new Appwrite.Client().setEndpoint(C.endpoint).setProject(C.projectId),account=new Appwrite.Account(client),db=new Appwrite.TablesDB(client),storage=new Appwrite.Storage(client),ID=Appwrite.ID,Query=Appwrite.Query,Permission=Appwrite.Permission,Role=Appwrite.Role,$=x=>document.getElementById(x),eur=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});let user=null;async function me(){try{return await account.get()}catch{return null}}async function rows(t,q=[]){let r=await db.listRows({databaseId:C.databaseId,tableId:t,queries:q,total:false});return r.rows||[]}async function activeCampaign(){let r=await rows(C.campaignsTable);return r.find(x=>x.active)||null}async function render(){user=await me();if(!user){$('auth').classList.remove('hidden');$('dash').classList.add('hidden');return}$('auth').classList.add('hidden');$('dash').classList.remove('hidden');$('hello').textContent=user.name||user.email;let c=await activeCampaign();$('camp').textContent=c?.name||'Sin campaña';let ts=await rows(C.ticketsTable,[Query.equal('customer_email',user.email)]),ct=c?ts.filter(t=>t.campaign_id===c.$id):[],v=ct.filter(t=>t.status==='validado');$('entries').textContent=v.reduce((a,t)=>a+Number(t.entries||0),0);$('ticketsCount').textContent=v.length;$('spend').textContent=eur(v.reduce((a,t)=>a+Number(t.amount||0),0));$('list').innerHTML=ts.length?ts.map(t=>`<div class='item'><b>${t.ticket_number||'Ticket'}</b><div class='muted'>${eur(t.amount)} · ${t.status}</div><div class='muted'>Participaciones: ${t.entries||0}</div></div>`).join(''):'<div class="muted">Aún no hay tickets.</div>'}signup.onclick=async()=>{try{let email=$('email').value.trim().toLowerCase(),password=$('pass').value,name=$('name').value.trim();await account.create({userId:ID.unique(),email,password,name:name||email.split('@')[0]});await account.createEmailPasswordSession({email,password});user=await account.get();await db.createRow({databaseId:C.databaseId,tableId:C.customersTable,rowId:ID.unique(),data:{name:user.name,email:user.email,marketing_consent:$('marketing').checked,active:true,created_at:new Date().toISOString()},permissions:[Permission.read(Role.user(user.$id)),Permission.update(Role.user(user.$id))]});await render()}catch(e){$('msg').textContent=e.message}};login.onclick=async()=>{try{await account.createEmailPasswordSession({email:$('email').value.trim().toLowerCase(),password:$('pass').value});await render()}catch(e){$('msg').textContent=e.message}};logout.onclick=async()=>{await account.deleteSession({sessionId:'current'});render()};send.onclick=async()=>{try{let f=$('photo').files[0],amount=Number($('amount').value);if(!f)throw Error('Haz una foto del ticket');let c=await activeCampaign();if(!c)throw Error('No hay campaña activa');let file=await storage.createFile({bucketId:C.ticketsBucket,fileId:ID.unique(),file:f,permissions:[Permission.read(Role.user(user.$id))]});await db.createRow({databaseId:C.databaseId,tableId:C.ticketsTable,rowId:ID.unique(),data:{customer_email:user.email,ticket_number:$('ticketNo').value.trim(),amount,channel:$('channel').value,status:'pendiente',entries:0,photo_file_id:file.$id,campaign_id:c.$id,created_at:new Date().toISOString(),validated_at:null},permissions:[Permission.read(Role.user(user.$id))]});$('sendMsg').textContent='Ticket enviado. Pendiente de validación.';await render()}catch(e){$('sendMsg').textContent=e.message}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();</script></body></html>
